name: SoberCoach
options:
  bundleIdPrefix: app.sobercoach
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.20.0"
targets:
  SoberCoach:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes: ["**/appmap.log", "**/*.log"]
      - path: Resources
        excludes: ["**/appmap.log", "**/*.log"]
    dependencies:
      - package: Supabase
        product: Supabase
    entitlements:
      path: SoberCoach.entitlements
      properties:
        aps-environment: development
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: SoberCoach
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [remote-notification]
        ITSAppUsesNonExemptEncryption: false
        NSUserNotificationsUsageDescription: SoberCoach sends at most one reminder a day, only for categories you keep on.
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        CFBundleURLTypes:
          - CFBundleURLSchemes: [sobercoach]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.sobercoach.ios
        SWIFT_VERSION: "5.10"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
  SoberCoachTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes: ["**/*.log"]
    dependencies:
      - target: SoberCoach
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  SoberCoachUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
        excludes: ["**/*.log"]
    dependencies:
      - target: SoberCoach
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SoberCoach:
    build:
      targets:
        SoberCoach: all
        SoberCoachTests: [test]
        SoberCoachUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [SoberCoachTests, SoberCoachUITests]
    archive:
      config: Release
